name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build -x test

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rswirelesscrafting-neoforge
          path: rswirelesscrafting-neoforge/build/libs/*.jar
          if-no-files-found: error
