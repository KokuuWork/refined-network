modLoader = "javafml"
loaderVersion = "[2,)"
issueTrackerURL = "https://github.com/KokuuWork/refined-network/issues"
license = "MIT"
[[mods]]
modId = "rswirelesscrafting"
version = "${version}"
displayName = "Refined Network"
displayURL = "https://github.com/KokuuWork/refined-network"
logoFile = "assets/rswirelesscrafting/icon.png"
authors = "Kokuu"
description = '''
A Refined Storage 2 addon with wireless crafting, pattern editing, inventory monitoring
and network devices. Remote access requires an eligible target, upgrades, permission,
energy and loaded chunks; action costs depend on distance or dimension.
'''
[[mixins]]
config="rswirelesscrafting.mixins.json"
[[dependencies.rswirelesscrafting]]
modId = "refinedstorage"
type = "required"
versionRange = "[2.0.7,)"
side = "BOTH"
